# cargo-deny: licences, advisories, duplicate and banned dependencies. Run: cargo deny check
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "OFL-1.1", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[advisories]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = ["https://github.com/zed-industries/zed"]
