[package]
name = "nexdesk-rdp"
description = "NexDesk RDP protocol process built on IronRDP"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexdesk-rdp"
path = "src/main.rs"

[dependencies]
nexdesk-core = { path = "../nexdesk-core" }
ironrdp-client = { version = "=0.1.0", features = ["rustls", "clipboard"] }
ironrdp-input = "0.7"
ironrdp-pdu = "0.9"
picky-krb = "=0.12.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
winit = "0.30"
softbuffer = "0.4"
anyhow = "1"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
