[package]
name = "nexdesk-rdp"
description = "NexDesk RDP protocol process built on IronRDP"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nexdesk-rdp"
path = "src/main.rs"

[dependencies]
nexdesk-core = { path = "../nexdesk-core" }
nexdesk-clipboard = { path = "../nexdesk-clipboard" }
ironrdp-tls = { version = "0.2", features = ["rustls"] }
sha2 = "0.10"
rustls-native-certs = "0.8"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
font8x8 = { version = "0.3", default-features = false, features = ["std"] }
ironrdp-client = { version = "=0.1.0", features = ["rustls", "clipboard"] }
ironrdp-input = "0.7"
ironrdp-pdu = "0.9"
picky-krb = "=0.12.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
winit = "0.30"
softbuffer = "0.4"
anyhow = "1"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Keyboard capture (Linux only): X11 via XInput2, Wayland via shortcuts-inhibit.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
