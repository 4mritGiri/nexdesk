[workspace]
resolver = "2"
members = [
    "apps/manager",
    "apps/rdp-viewer",
    "crates/nexdesk-core",
    "crates/nexdesk-session",
    "crates/nexdesk-renderer",
    "crates/nexdesk-ui",
    "crates/nexdesk-clipboard",
    "crates/nexdesk-crypto",
    "crates/nexdesk-peer",
    "crates/nexdesk-network",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Local patches of three IronRDP crates (see vendor/README.md):
#  * ironrdp-client: lets the embedding app inject a clipboard backend and a TLS verifier
#  * ironrdp-tls:    adds `upgrade_with_verifier` (stock code accepts every certificate)
#  * ironrdp-connector: continues when a server skips licensing (stock code fails)
[patch.crates-io]
ironrdp-client = { path = "vendor/ironrdp-client" }
ironrdp-tls = { path = "vendor/ironrdp-tls" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
