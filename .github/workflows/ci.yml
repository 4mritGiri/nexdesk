name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (full workspace)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev libpipewire-0.3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxi-dev \
            libfontconfig1-dev libvulkan-dev libssl-dev
      - run: cargo check --workspace --all-targets
      - name: Tests (crates that do not need a display toolkit)
        run: cargo test -p nexdesk-core -p nexdesk-crypto -p nexdesk-network -p nexdesk-peer
      - name: Peer without Wayland support
        run: cargo check -p nexdesk-peer --all-targets --no-default-features

  quality:
    name: Format, lints, licences, advisories
    runs-on: ubuntu-24.04
    continue-on-error: true   # tighten to blocking once the tree is clean
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo install cargo-audit --locked && cargo audit

  # The viewer, relay and shared libraries are meant to build on every desktop OS. The agent builds there but
  # reports that sharing the screen is not supported yet (src/platform/unsupported.rs).
  # continue-on-error until these jobs have been green once; then remove it so they gate merges.
  portable:
    name: ${{ matrix.os }} (viewer, relay, libraries)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p nexdesk-core -p nexdesk-crypto -p nexdesk-network -p nexdesk-peer --all-targets
      - run: cargo test -p nexdesk-crypto -p nexdesk-network -p nexdesk-peer --lib
